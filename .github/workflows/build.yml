name: build

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Setting up environment
      run: |
        echo "Preparing setup"
        chmod +x "./.github/workflows/${GITHUB_WORKFLOW}/setup.sh"
        source "./.github/workflows/${GITHUB_WORKFLOW}/setup.sh"
      env:
        BS_SSH_KEY_SECRET: ${{ secrets.SSH_KEY_SECRET }}
        BS_ENC_KEY_SECRET: ${{ secrets.ENC_KEY_SECRET }}
        BS_PULL_REQUEST: 'false'
        BS_IS_DEPLOYMENT: 'false'
        
    - name: Setting outputs
      run: |
        echo "Setting outputs"
        echo "build_number=${BS_BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "build_type=${BS_BUILD_TYPE}" >> $GITHUB_OUTPUT
        echo "build_release=${BS_BUILD_RELEASE}" >> $GITHUB_OUTPUT
        echo "build_prerelease=${BS_BUILD_PRERELEASE}" >> $GITHUB_OUTPUT
        echo "build_title=${BS_BUILD_TITLE}" >> $GITHUB_OUTPUT
        echo "build_tag=${BS_BUILD_TAG}" >> $GITHUB_OUTPUT
        echo "build_url=${BS_BUILD_URL}" >> $GITHUB_OUTPUT
        echo "build_branch=${BS_BUILD_BRANCH}" >> $GITHUB_OUTPUT
        echo "build_commit=${BS_BUILD_COMMIT}" >> $GITHUB_OUTPUT
        echo "build_notes=${BS_BUILD_NOTES}" >> $GITHUB_OUTPUT
        echo "build_workspace=${BS_BUILD_WORKSPACE}" >> $GITHUB_OUTPUT
        echo "deploy_repository_uri=${BS_DEPLOY_REPOSITORY_URI}" >> $GITHUB_OUTPUT
        echo "deploy_repository_branch=${BS_DEPLOY_REPOSITORY_BRANCH}" >> $GITHUB_OUTPUT
        echo "deploy_name=${BS_DEPLOY_NAME}" >> $GITHUB_OUTPUT
        echo "is_deployment=false" >> $GITHUB_OUTPUT
      id: "env"
        
    - name: Building
      run: |
        echo "Preparing build"
        chmod +x "./.github/workflows/${GITHUB_WORKFLOW}/build.sh"
        source "./.github/workflows/${GITHUB_WORKFLOW}/build.sh"
      env:
        BS_SSH_KEY_SECRET: ${{ secrets.SSH_KEY_SECRET }}
        BS_ENC_KEY_SECRET: ${{ secrets.ENC_KEY_SECRET }}
        BS_PULL_REQUEST: 'false'
        BS_IS_DEPLOYMENT: 'false'
        
    - name: List build artifacts  
      run: |  
        echo "=== Build Artifacts ==="  
        ls -lh build/libs/  
          
    - name: Upload Universal JAR  
      uses: actions/upload-artifact@v4  
      with:  
        name: TheBetweenlands-Universal  
        path: build/libs/*-universal.jar  
        if-no-files-found: error  
          
    - name: Upload Server JAR  
      uses: actions/upload-artifact@v4  
      with:  
        name: TheBetweenlands-Server  
        path: build/libs/*-server.jar  
        if-no-files-found: error  
          
    - name: Upload All Artifacts  
      uses: actions/upload-artifact@v4  
      with:  
        name: TheBetweenlands-All-Artifacts  
        path: build/libs/  
        if-no-files-found: error
